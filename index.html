<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ELC 스피치 대회 청중 투표</title>
<link id="fav" rel="icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#272560;--deep:#15133d;--lav:#B8A6F2;--lav2:#E9E2FB;--lav3:#F6F2FF;--lime:#F4EE5A;--mute:#5f5a99;--disp:'Black Han Sans','Pretendard',sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:Pretendard,system-ui,sans-serif;color:var(--deep);min-height:100dvh;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 500px at 85% -5%,#d6c8ff,transparent 65%),linear-gradient(165deg,var(--lav3),var(--lav2))}
button{font:inherit;cursor:pointer;border:0}
input{font:inherit;padding:.65rem .8rem;border:2px solid #d8d0f5;border-radius:12px;width:100%}
.hide{display:none!important}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;padding:.8rem 1.1rem;padding-top:calc(.8rem + env(safe-area-inset-top,0px))}
.badge{background:#fff;border-radius:18px;padding:.35rem .6rem;box-shadow:0 6px 18px #27256024}
.logo{height:3rem;display:block}
body.scr .logo{height:4.2rem}
.top>div:nth-child(2){flex:1;min-width:0}
.top b{display:block;font:400 1.35rem var(--disp);color:var(--navy)}
.top small{color:var(--mute);font-weight:600}
.tag{background:var(--lime);color:var(--deep);border-radius:8px;padding:.1rem .5rem;margin-left:.4rem;font-weight:700;font-size:.8rem}
body:not(.scr) .tag{display:none}
.pill{background:var(--navy);color:#fff;border-radius:99px;padding:.45rem .95rem;font-weight:700;font-size:.9rem}
.pill i{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--lime);margin-right:.5rem;animation:pu 1.4s infinite}
.pill.off i{background:#ff8f8f;animation:none}
@keyframes pu{50%{opacity:.25}}
.wrap{max-width:520px;margin:0 auto;padding:.4rem 1.1rem calc(2rem + env(safe-area-inset-bottom,0px))}
h1{font:400 1.9rem/1.25 var(--disp);color:var(--navy);margin:.7rem 0 .4rem}
.sub{color:var(--mute);margin-bottom:1.1rem;line-height:1.5}
.card{display:flex;gap:.9rem;align-items:center;width:100%;text-align:left;background:#fff;border:3px solid transparent;border-radius:24px 24px 24px 8px;padding:1rem;margin-bottom:.8rem;box-shadow:0 8px 22px #2725601a;transition:.18s}
.card .no{flex:none;width:3.3rem;height:3.3rem;border-radius:14px;background:var(--lav2);color:var(--navy);display:grid;place-items:center;font:400 1.7rem var(--disp)}
.card b{display:block;font-size:1.12rem;color:var(--navy);margin-bottom:.15rem}
.card span{color:var(--mute);font-size:.93rem;line-height:1.35}
.card.sel{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 12px 0 -4px var(--lime),0 12px 26px #27256033}
.card.sel .no{background:var(--navy);color:var(--lime)}
.cta{width:100%;margin-top:.6rem;padding:1.05rem;border-radius:18px;background:var(--navy);color:#fff;font-weight:800;font-size:1.12rem;box-shadow:0 6px 0 var(--deep)}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 var(--deep)}
.cta:disabled{background:#bdb9dc;box-shadow:none;cursor:not-allowed}
.center{text-align:center;padding-top:2rem}
.ok{width:6rem;height:6rem;margin:0 auto 1rem;border-radius:50%;background:var(--lime);color:var(--navy);display:grid;place-items:center;font:400 3rem var(--disp);box-shadow:0 0 0 .6rem #f4ee5a55;animation:pop .5s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
/* screen */
#v-scr{display:grid;grid-template-columns:minmax(300px,22rem) 1fr;gap:1.6rem;padding:.4rem 1.6rem 6rem}
aside{display:flex;flex-direction:column;gap:1rem}
.panel{background:#fff;border-radius:26px;padding:1.1rem;text-align:center;box-shadow:0 10px 26px #2725601a}
.panel span{font-weight:700;color:var(--mute)}
.panel strong{display:block;font:400 4.2rem/1.1 var(--disp)}
.panel.navy{background:var(--navy)}.panel.navy span{color:#cfcaf5}.panel.navy strong{color:var(--lime)}
.bump{animation:bump .35s}@keyframes bump{40%{transform:scale(1.2)}}
.low{color:#d7263d;animation:pu .6s infinite}
#qr{width:15rem;margin:0 auto .6rem}#qr img,#qr canvas{width:100%!important;height:auto!important;display:block}
.panel b{display:block;color:var(--navy)}code{display:block;margin-top:.3rem;font-size:.8rem;word-break:break-all;color:var(--mute)}
h2{font:400 2.3rem var(--disp);color:var(--navy);margin:.4rem 0 1rem}
.row{background:#fff;border-radius:28px;padding:1.1rem 1.5rem 1.3rem;margin-bottom:1.1rem;display:grid;grid-template-columns:4.2rem 1fr auto;gap:.5rem 1.2rem;align-items:center;box-shadow:0 10px 26px #2725601a;transition:.4s}
.row .no{width:4.2rem;height:4.2rem;border-radius:18px;background:var(--navy);color:var(--lime);display:grid;place-items:center;font:400 2.4rem var(--disp)}
.who b{display:block;font-size:1.7rem;font-weight:800;color:var(--navy)}.who span{color:var(--mute);font-size:1.05rem}
.pct{font:400 2.8rem var(--disp);color:var(--navy);text-align:right;min-width:10rem}
.pct small{font-size:1.3rem}.pct em{display:block;font:700 1rem Pretendard;color:var(--mute)}
.blind .pct{font-size:1.5rem;color:#9a93cf}
.track{grid-column:1/-1;height:1.7rem;background:var(--lav2);border-radius:99px;overflow:hidden;position:relative}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--lav),#8c74e8);transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.blind .track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#fff0 0 16px,#ffffffa0 16px 32px);background-size:45px 100%;animation:sl 1s linear infinite}
@keyframes sl{to{background-position:45px 0}}
.win{box-shadow:0 0 0 .3rem var(--lime),0 0 0 .7rem var(--navy),0 18px 40px #27256055;transform:scale(1.025)}
.win .fill{background:linear-gradient(90deg,var(--navy),#4f46c4)}
.win .who b::before{content:"👑 "}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:50;pointer-events:none;animation:fall 3.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),108vh) rotate(720deg)}}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;padding:.8rem;padding-bottom:calc(.8rem + env(safe-area-inset-bottom,0px));background:#ffffffd9;backdrop-filter:blur(10px);z-index:10}
.b{padding:.7rem 1.1rem;border-radius:14px;background:#fff;color:var(--navy);font-weight:800;border:2px solid var(--navy)}
.b.pri{background:var(--navy);color:#fff}.b.lime{background:var(--lime);padding-inline:1.8rem}.b.dng{color:#c0262d;border-color:#c0262d}
dialog{border:0;border-radius:26px;padding:1.4rem;width:min(600px,94vw);margin:auto;color:var(--deep)}
dialog::backdrop{background:#15133d88;backdrop-filter:blur(3px)}
dialog h3{font:400 1.5rem var(--disp);color:var(--navy);margin-bottom:.9rem}
.er{display:grid;grid-template-columns:1.6rem 1fr 1.6fr;gap:.5rem;margin-bottom:.5rem;align-items:center;font-weight:800}
.lb{display:block;margin:.8rem 0;font-weight:700;font-size:.9rem;color:var(--mute)}.lb input{margin-top:.3rem}
.acts{display:flex;flex-wrap:wrap;gap:.5rem}.note{margin-top:.8rem;font-size:.82rem;color:var(--mute);line-height:1.5}
@media(max-width:900px){#v-scr{grid-template-columns:1fr}.row{grid-template-columns:3rem 1fr}.pct{grid-column:1/-1;text-align:left}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="badge"><img class="logo" alt="English Literature"></span>
  <div><b>ELC 스피치 대회</b><small>청중 투표<span id="mode" class="tag"></span></small></div>
  <div class="pill" id="pill"><i></i><span id="st"></span></div>
</header>

<main id="v-aud" class="wrap">
  <section id="a-load" class="center"><div class="ok">…</div><h1>연결 중이에요</h1><p class="sub">잠시만 기다려 주세요. 오래 걸리면 새로고침해 주세요.</p></section>
  <section id="a-vote">
    <h1>가장 인상 깊었던 스피치에 투표해 주세요</h1>
    <p class="sub">한 사람당 한 번만 투표할 수 있고, 투표 후에는 바꿀 수 없어요.</p>
    <div id="a-cards"></div>
    <button id="a-go" class="cta" disabled>투표하기</button>
  </section>
  <section id="a-done" class="hide center">
    <div class="ok">✓</div><h1>투표가 완료되었어요</h1>
    <p class="sub" id="a-my"></p><p class="sub" id="a-msg"></p>
  </section>
  <section id="a-off" class="hide center">
    <div class="ok">⏱</div><h1>투표가 마감되었어요</h1><p class="sub"></p>
  </section>
</main>

<main id="v-scr" class="hide">
  <aside>
    <div class="panel"><div id="qr"></div><b>QR을 스캔해서 투표하세요</b><code id="url"></code></div>
    <div class="panel navy"><span>실시간 총 투표수</span><strong id="tot">0</strong></div>
    <div class="panel"><span>남은 시간</span><strong id="tmr">--:--</strong></div>
  </aside>
  <section><h2>오늘의 스피치, 1위는 누구일까요?</h2><div id="rows"></div></section>
</main>

<div class="bar hide">
  <select id="min" class="b"><option value="1">1분</option><option value="2">2분</option><option value="3" selected>3분</option></select>
  <button id="b-start" class="b">▶ 타이머 시작</button>
  <button id="b-close" class="b"></button>
  <button id="b-rev" class="b lime"></button>
  <button id="b-gear" class="b" title="관리자 설정">⚙️ 설정</button>
</div>

<dialog id="dlg">
  <h3>관리자 설정</h3>
  <div id="ed"></div>
  <label class="lb">QR에 넣을 주소 (배포 URL, 비우면 현재 주소)<input id="qrurl" placeholder="https://..."></label>
  <div class="acts">
    <button id="d-save" class="b pri">저장</button>
    <button id="d-my" class="b">이 기기 투표 기록만 삭제</button>
    <button id="d-test" class="b">부하 테스트(가짜 70표)</button>
    <button id="d-reset" class="b dng">전체 초기화</button>
    <button id="d-x" class="b">닫기</button>
  </div>
  <p class="note" id="d-info"></p>
</dialog>

<script>
/* ============================================================

/* ② 상태: c=참가자, v=득표, closed=마감, rev=결과공개, end=타이머 종료시각, ep=투표 회차(초기화 시 변경) */
const norm=x=>{x=x||{};return{
  c:[0,1,2].map(i=>({n:x.c?.[i]?.n||`참가자 ${i+1}`,t:x.c?.[i]?.t||'스피치 주제를 입력하세요'})),
  v:[0,1,2].map(i=>+x.v?.[i]||0),closed:!!x.closed,rev:!!x.rev,end:+x.end||0,ep:+x.ep||1}};
let S=norm(), store, sel=-1, ck='', wasRev=false, lastOpen=true, qrDone='', ready=false, busy=false, OFF=0, rt=0, watch=()=>{};
const now=()=>Date.now()+OFF;   // Firebase 서버 시간 기준 (폰마다 시계가 달라도 마감이 일치)
const open=()=>!S.closed&&!(S.end&&now()>=S.end);
const mine=()=>{try{const m=JSON.parse(localStorage.getItem(MY));return m&&m.ep===S.ep?m.i:-1}catch(e){return -1}};
const emit=s=>{S=s;ready=true;render()};
const sched=()=>{clearTimeout(rt);rt=setTimeout(render,100)};   // 투표가 몰려도 화면 갱신은 0.1초 단위로 묶음

/* ③ 스크린 득표 행 (한 번만 생성) */
const rows=[0,1,2].map(i=>{const e=document.createElement('div');e.className='row blind';
  e.innerHTML=`<div class="no">${i+1}</div><div class="who"><b></b><span></span></div><div class="pct">집계 중…</div><div class="track"><div class="fill"></div></div>`;
  $('#rows').append(e);return{e,b:e.querySelector('b'),s:e.querySelector('.who span'),p:e.querySelector('.pct'),f:e.querySelector('.fill')}});

/* ④ 렌더링 */
function render(){
  const scr=location.hash==='#screen';
  document.documentElement.style.fontSize=scr?'clamp(13px,1.05vw,30px)':'';
  document.body.classList.toggle('scr',scr);
  $('#v-aud').classList.toggle('hide',scr);$('#v-scr').classList.toggle('hide',!scr);$('.bar').classList.toggle('hide',!scr);
  lastOpen=open(); rHead(); scr?rScr():rAud();
}
function rHead(){
  $('#st').textContent=!ready?'연결 중…':open()?'투표 진행 중'+(S.end?' '+fmt(S.end-now()):''):S.rev?'결과 발표':'투표 마감';
  $('#pill').classList.toggle('off',!ready||!open());
}
function rAud(){
  const m=mine(),o=open(),msg=S.rev?'🎉 결과가 발표됐어요! 스크린을 확인해 주세요.':'결과는 곧 스크린에서 공개됩니다.';
  $('#a-load').classList.toggle('hide',ready);
  $('#a-vote').classList.toggle('hide',!ready||m>=0||!o);$('#a-done').classList.toggle('hide',m<0);$('#a-off').classList.toggle('hide',!ready||m>=0||o);
  const k=JSON.stringify(S.c);   // 이름/주제가 바뀔 때만 카드를 다시 그려 터치가 끊기지 않게 함
  if(k!==ck){ck=k;$('#a-cards').innerHTML=S.c.map((c,i)=>`<button class="card" data-i="${i}"><div class="no">${i+1}</div><div><b>${esc(c.n)}</b><span>${esc(c.t)}</span></div></button>`).join('')}
  $$('#a-cards .card').forEach((c,i)=>c.classList.toggle('sel',i===sel));
  $('#a-go').disabled=sel<0||busy;
  if(m>=0){$('#a-my').textContent=`기호 ${m+1}번 ${S.c[m].n} 참가자에게 투표했어요.`;$('#a-msg').textContent=msg}
  else $('#a-off .sub').textContent=msg;
}
function rScr(){
  qr();
  const tot=S.v.reduce((a,b)=>a+b,0),mx=Math.max(...S.v),rk=[0,1,2].sort((a,b)=>S.v[b]-S.v[a]),t=$('#tot');
  if(t.textContent!=tot){t.textContent=tot;t.classList.remove('bump');void t.offsetWidth;t.classList.add('bump')}
  const anim=S.rev&&!wasRev; wasRev=S.rev;
  rows.forEach((r,i)=>{
    r.b.textContent=S.c[i].n;r.s.textContent=S.c[i].t;
    const p=tot?S.v[i]/tot*100:0,d=anim?(2-rk.indexOf(i))*.9:0;   // 3위 → 2위 → 1위 순서로 공개
    r.e.classList.toggle('blind',!S.rev);
    r.f.style.transitionDelay=d+'s';r.f.style.width=S.rev?p+'%':'0%';
    if(!S.rev){r.p.textContent='집계 중…';r.e.classList.remove('win')}
    else if(anim)cnt(r.p,p,S.v[i],d*1000);
    else r.p.innerHTML=`${p.toFixed(1)}<small>%</small><em>${S.v[i]}표</em>`;
    clearTimeout(r.t);r.t=setTimeout(()=>r.e.classList.toggle('win',!!(S.rev&&tot&&S.v[i]===mx)),anim?3600:0);
  });
  if(anim&&tot)setTimeout(boom,3600);
  $('#b-close').textContent=open()?'⏹ 투표 마감':'↺ 투표 재개';
  $('#b-rev').textContent=S.rev?'블라인드로 되돌리기':'🏆 결과 공개';
}
function cnt(el,p,v,delay){const t0=performance.now()+delay;(function f(t){const k=Math.min(1,Math.max(0,(t-t0)/1600)),e=1-Math.pow(1-k,3);
  el.innerHTML=`${(p*e).toFixed(1)}<small>%</small><em>${Math.round(v*e)}표</em>`;k<1&&requestAnimationFrame(f)})(performance.now())}
function boom(){for(let i=0;i<70;i++){const d=document.createElement('i');d.className='cf';
  d.style.cssText=`left:${Math.random()*100}vw;background:${['#F4EE5A','#B8A6F2','#272560','#fff'][i%4]};animation-delay:${Math.random()*.8}s;--x:${(Math.random()-.5)*240}px`;
  document.body.append(d);setTimeout(()=>d.remove(),4600)}}
function qr(){
  const u=localStorage.getItem(QK)||location.href.split('#')[0];if(u===qrDone)return;qrDone=u;
  if(typeof QRCode==='undefined'){$('#url').textContent='QR 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하세요.';return}
  $('#qr').innerHTML='';new QRCode($('#qr'),{text:u,width:512,height:512,colorDark:'#272560',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  $('#url').textContent=u.replace(/^https?:\/\//,'')+(location.protocol==='file:'&&!localStorage.getItem(QK)?' (로컬 파일 주소예요. 설정에서 배포 URL을 입력하세요)':'');
}

/* ⑤ 청중 동작: 서버가 저장을 확인(ack)한 뒤에만 "투표 완료" 처리 */
$('#a-cards').onclick=e=>{const c=e.target.closest('.card');if(!c||!open()||mine()>=0||busy)return;sel=+c.dataset.i;rAud()};
$('#a-go').onclick=async()=>{
  if(sel<0||busy||mine()>=0||!open())return;
  const b=$('#a-go'),i=sel;busy=true;b.disabled=true;b.textContent='전송 중…';
  try{await store.vote(i);localStorage.setItem(MY,JSON.stringify({ep:S.ep,i}));sel=-1;store.done&&store.done()}
  catch(e){alert(e==='closed'?'투표가 마감되어 반영되지 않았어요.':'전송이 지연되고 있어요. 네트워크를 확인하고 다시 눌러 주세요.')}
  busy=false;b.textContent='투표하기';render();
};

/* ⑥ 진행자 동작 */
$('#b-start').onclick=()=>store.set({end:now()+$('#min').value*6e4,closed:false,rev:false});
$('#b-close').onclick=()=>store.set(open()?{closed:true}:{closed:false,end:0,rev:false});
$('#b-rev').onclick=()=>store.set(S.rev?{rev:false}:{rev:true,closed:true});
$('#b-gear').onclick=()=>{
  $('#ed').innerHTML=S.c.map((c,i)=>`<div class="er"><span>${i+1}</span><input id="n${i}" value="${esc(c.n)}" placeholder="참가자 이름"><input id="t${i}" value="${esc(c.t)}" placeholder="스피치 주제"></div>`).join('');
  $('#qrurl').value=localStorage.getItem(QK)||'';
  $('#d-info').textContent=useFB()?'Firebase 실시간 모드입니다. 모든 기기의 투표가 서버에서 합산되고, 마감과 타이머도 서버 시간 기준으로 적용돼요. 부하 테스트 후에는 반드시 전체 초기화를 눌러 주세요.':'데모/로컬 모드입니다. 이 브라우저 안에서만 집계돼요. 여러 스마트폰을 합산하려면 코드 상단의 Firebase 설정을 입력하세요.';
  $('#dlg').showModal()};
$('#d-save').onclick=()=>{
  store.set({c:[0,1,2].map(i=>({n:$('#n'+i).value.trim()||`참가자 ${i+1}`,t:$('#t'+i).value.trim()||'스피치 주제'}))});
  const q=$('#qrurl').value.trim();q?localStorage.setItem(QK,q):localStorage.removeItem(QK);qrDone='';$('#dlg').close();render()};
$('#d-my').onclick=()=>{localStorage.removeItem(MY);render();$('#dlg').close()};
$('#d-test').onclick=()=>{if(!open()){alert('투표가 열려 있을 때만 테스트할 수 있어요. 먼저 투표를 재개해 주세요.');return}
  if(confirm('가짜 70표를 동시에 전송해 부하를 테스트합니다. 끝나면 전체 초기화를 눌러 주세요.'))store.fake(70);$('#dlg').close()};
$('#d-reset').onclick=()=>{
  if(!confirm('투표 현황(득표수와 모든 기기의 투표 기록)을 0으로 초기화합니다.\n되돌릴 수 없어요. 계속할까요?'))return;
  localStorage.removeItem(MY);sel=-1;store.set({v:[0,0,0],rev:false,closed:false,end:0,ep:Date.now()});$('#dlg').close()};
$('#d-x').onclick=()=>$('#dlg').close();

/* ⑦ 저장소: Firebase 또는 로컬
 *   Firebase 구조: meta(설정·상태) + votes/{회차}/{기기ID}=후보번호
 *   기기마다 서로 다른 키에 한 번만 쓰므로 70명이 동시에 눌러도 충돌(재시도)이 없고,
 *   청중 폰은 meta만 구독하고 득표 집계는 스크린 화면만 구독해서 트래픽이 적습니다. */
const useFB=()=>!!(FB_CONFIG.apiKey&&(FB_CONFIG.databaseURL||FB_CONFIG.projectId));
const load=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.append(s)});
const setMode=t=>$('#mode').textContent=t;
async function boot(){
  if(useFB()){
    try{
      const b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
      await load(b+'app-compat.js');await load(b+'database-compat.js');
      firebase.initializeApp({apiKey:FB_CONFIG.apiKey,projectId:FB_CONFIG.projectId,
        databaseURL:FB_CONFIG.databaseURL||`https://${FB_CONFIG.projectId}-default-rtdb.firebaseio.com`});
      const db=firebase.database(),root=db.ref(FB_PATH),meta=root.child('meta');let vref=null,vep=0;
      db.ref('.info/serverTimeOffset').on('value',s=>{OFF=s.val()||0});
      db.ref('.info/connected').on('value',s=>setMode(s.val()?'LIVE 실시간 동기화':'연결 끊김'));
      watch=()=>{   // 득표 집계는 스크린 화면에서만 구독
        if(location.hash!=='#screen'||(vref&&vep===S.ep))return;
        vref&&vref.off();vep=S.ep;vref=root.child('votes/'+S.ep);
        vref.on('value',sn=>{const v=[0,0,0];sn.forEach(c=>{const x=c.val();if(x>=0&&x<3)v[x|0]++});S={...S,v};sched()})};
      store={
        set:p=>{const{v,...q}=p;return meta.update(q)},
        vote:i=>{const ref=root.child(`votes/${S.ep}/${VID}`);
          const w=ref.set(i).catch(async e=>{const g=await ref.get();if(g.exists()&&g.val()===i)return;throw'closed'});
          return Promise.race([w,new Promise((_,no)=>setTimeout(()=>no('slow'),10000))])},
        done:()=>FREE_CONN&&setTimeout(()=>db.goOffline(),1500),
        fake:n=>Promise.all([...Array(n)].map(()=>root.child(`votes/${S.ep}/test${Math.random().toString(36).slice(2,10)}`).set(Math.random()*3|0)))};
      meta.on('value',sn=>{
        if(!sn.exists()){if(location.hash==='#screen'){const{v,...m}=norm();meta.set({...m,ep:Date.now()})}return}   // 초기 데이터는 스크린 화면만 생성
        const m=norm(sn.val());emit({...m,v:m.ep===S.ep?S.v:[0,0,0]});watch()});
      return;
    }catch(e){console.error(e);setMode('Firebase 연결 실패, 데모 모드')}
  }
  const rd=()=>norm(JSON.parse(localStorage.getItem(K))),wr=s=>{localStorage.setItem(K,JSON.stringify(s));emit(s)};
  store={vote:i=>{const s=rd();s.v[i]++;wr(s)},set:p=>wr({...rd(),...p}),fake:n=>{const s=rd();for(let k=0;k<n;k++)s.v[Math.random()*3|0]++;wr(s)}};
  if(!localStorage.getItem(K))localStorage.setItem(K,JSON.stringify({...norm(),ep:Date.now()}));
  addEventListener('storage',e=>e.key===K&&emit(rd()));   // 같은 브라우저의 다른 탭과 실시간 연동
  if(!$('#mode').textContent)setMode('DEMO 로컬 모드');emit(rd());
}
addEventListener('hashchange',()=>{render();watch()});
setInterval(()=>{ // 타이머 갱신, 시간이 끝나면 자동으로 마감 화면 전환
  const r=S.end?Math.max(0,S.end-now()):0;
  $('#tmr').textContent=S.end?fmt(r):'--:--';$('#tmr').classList.toggle('low',open()&&S.end&&r<=10000);
  rHead();if(ready&&open()!==lastOpen)render();
},250);
render();boot();
</script>
</body>
</html>
